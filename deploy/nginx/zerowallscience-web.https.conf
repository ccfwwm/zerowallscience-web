# zerowallscience-web — HTTPS
# .com and www.* redirect → canonical .org
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zerowallscience.org zerowallscience.com www.zerowallscience.com;

    ssl_certificate /etc/letsencrypt/live/zerowallscience.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerowallscience.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:zwsci_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://zerowallscience.org$request_uri;
}

# Canonical — zerowallscience.org
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zerowallscience.org;

    ssl_certificate /etc/letsencrypt/live/zerowallscience.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerowallscience.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:zwsci_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/zerowallscience-web/current;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static assets — long cache
    location ~* \.(js|css|woff2?|ttf|ico|svg|webp|png|jpg|jpeg|gif|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # HTML — no cache (atomic deploys swap the symlink)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ACME (certbot renewal)
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    # Block dot-files
    location ~ /\. {
        return 404;
    }
}
