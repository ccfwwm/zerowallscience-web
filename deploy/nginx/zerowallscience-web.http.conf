# zerowallscience-web — HTTP (port 80)
# ACME challenge + 301 to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name zerowallscience.org www.zerowallscience.org zerowallscience.com www.zerowallscience.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://zerowallscience.org$request_uri;
    }
}
