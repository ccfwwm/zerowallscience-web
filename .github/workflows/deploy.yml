name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [release-published]
  schedule:
    - cron: '17 */6 * * *'  # every 6h, offset from :00

permissions:
  contents: read

concurrency:
  group: zerowallscience-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 66.154.100.202
  DEPLOY_PATH: /var/www/zerowallscience-web
  NODE_VERSION: '20'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy via rsync
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS="-o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          RELEASE_DIR="releases/$(git rev-parse --short HEAD)"
          NGINX_SOURCE="${{ env.DEPLOY_PATH }}/deploy-nginx"

          # rsync build output
          rsync -az --delete \
            -e "ssh $SSH_OPTS" \
            dist/ root@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/$RELEASE_DIR/

          # Keep the live Nginx config aligned with the repository.
          rsync -az --delete \
            -e "ssh $SSH_OPTS" \
            deploy/nginx/ root@${{ env.DEPLOY_HOST }}:$NGINX_SOURCE/

          # Validate config, atomically swap the release, and roll back on reload failure.
          ssh $SSH_OPTS root@${{ env.DEPLOY_HOST }} "RELEASE_DIR='$RELEASE_DIR' NGINX_SOURCE='$NGINX_SOURCE' bash -s" << 'EOF'
            set -euo pipefail

            cd /var/www/zerowallscience-web
            NGINX_TARGET="/etc/nginx/conf.d"
            HTTP_CONFIG="zerowallscience-web.http.conf"
            HTTPS_CONFIG="zerowallscience-web.https.conf"
            CONFIG_CHANGED=0
            BACKUP_DIR=""

            test -s "$NGINX_SOURCE/$HTTP_CONFIG"
            test -s "$NGINX_SOURCE/$HTTPS_CONFIG"

            if ! cmp -s "$NGINX_SOURCE/$HTTP_CONFIG" "$NGINX_TARGET/$HTTP_CONFIG" || \
               ! cmp -s "$NGINX_SOURCE/$HTTPS_CONFIG" "$NGINX_TARGET/$HTTPS_CONFIG"; then
              CONFIG_CHANGED=1
              BACKUP_DIR="/etc/nginx/backups/zerowallscience-web-$(date -u +%Y%m%dT%H%M%SZ)-${RELEASE_DIR##*/}"
              mkdir -p "$BACKUP_DIR"
              cp -a "$NGINX_TARGET/$HTTP_CONFIG" "$NGINX_TARGET/$HTTPS_CONFIG" "$BACKUP_DIR/"

              if ! {
                install -m 0644 "$NGINX_SOURCE/$HTTP_CONFIG" "$NGINX_TARGET/$HTTP_CONFIG"
                install -m 0644 "$NGINX_SOURCE/$HTTPS_CONFIG" "$NGINX_TARGET/$HTTPS_CONFIG"
                nginx -t
              }; then
                cp -a "$BACKUP_DIR/$HTTP_CONFIG" "$NGINX_TARGET/$HTTP_CONFIG"
                cp -a "$BACKUP_DIR/$HTTPS_CONFIG" "$NGINX_TARGET/$HTTPS_CONFIG"
                nginx -t
                exit 1
              fi
            else
              nginx -t
            fi

            OLD_RELEASE="$(readlink current)"
            ln -sfn "$RELEASE_DIR" current_new
            mv -Tf current_new current

            if ! systemctl reload nginx; then
              ln -sfn "$OLD_RELEASE" current_rollback
              mv -Tf current_rollback current
              if [ "$CONFIG_CHANGED" -eq 1 ]; then
                cp -a "$BACKUP_DIR/$HTTP_CONFIG" "$NGINX_TARGET/$HTTP_CONFIG"
                cp -a "$BACKUP_DIR/$HTTPS_CONFIG" "$NGINX_TARGET/$HTTPS_CONFIG"
              fi
              nginx -t
              systemctl reload nginx
              exit 1
            fi

            # Keep only 5 most recent releases after the new release is active.
            cd releases
            ls -t | tail -n +6 | xargs -r rm -rf
          EOF

          echo "✅ Deployed $(git rev-parse --short HEAD) to production"
